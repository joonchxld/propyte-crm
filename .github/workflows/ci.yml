# Integración continua del CRM.
#
# Por qué existe: hasta ahora las 2,000 pruebas del repositorio, el chequeo de tipos y el
# linter solo corrían cuando alguien se acordaba de correrlos en su máquina. La auditoría
# del 2026-09-03 encontró varios defectos que un `tsc` o una prueba habrían atrapado antes
# de llegar a producción — entre ellos un filtro que Prisma descartaba en silencio y un
# botón que llamaba a una ruta inexistente.
#
# Gestor de paquetes (#921): pnpm 10, el MISMO que usa producción (deploy.sh del VPS), y
# con `--frozen-lockfile`. Antes la CI corría `npm ci` sobre package-lock.json mientras el
# servidor instalaba con pnpm sobre pnpm-lock.yaml: la CI daba verde con versiones que
# producción no usaba (p. ej. @twilio/voice-sdk 2.18.5 en CI, 2.18.0 en prod — #920), y
# pnpm-lock.yaml pasó de mayo a octubre sin que nadie lo actualizara. Ahora un PR que cambia
# package.json sin actualizar pnpm-lock.yaml falla aquí con ERR_PNPM_OUTDATED_LOCKFILE.
#
# Qué NO incluye todavía, a propósito: `npm run build`. Es la comprobación más completa,
# pero necesita decidir qué variables de entorno se le dan en CI (hay 18 sin documentar en
# `.env.example`, según el plan de ejecución). Meterla antes de esa decisión dejaría el CI
# rojo desde el primer día, y un CI que siempre está rojo no lo mira nadie. Cuando esas
# variables estén definidas, se agrega como un paso más aquí.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido esperar
# el veredicto de un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, pruebas y linter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `prisma generate` valida el bloque `datasource`, así que exige que la variable
      # exista aunque no se conecte a nada. Es un valor de mentira: en CI no hay base de
      # datos y ninguna prueba la necesita (todas simulan `@/lib/db`).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=propyte_crm"
      # El chequeo de tipos sobre ~90 mil líneas se queda sin memoria con el límite por
      # defecto de Node. Pasó en la máquina de desarrollo antes de subirlo aquí.
      NODE_OPTIONS: --max-old-space-size=6144
      # Sin telemetría anónima de Next en CI, y sin su aviso en cada corrida.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      # Va ANTES de setup-node: su `cache: pnpm` necesita el binario de pnpm ya en el PATH.
      - uses: pnpm/action-setup@v6
        with:
          # La versión que usa producción (`npx pnpm@10.32.1` en /opt/propyte/crm/deploy.sh del
          # VPS; antes, la de hPanel, #773/#772). Fija y no «10» a secas: pnpm 11+ cambia la
          # aprobación de build scripts y rompe el install (#772). Si se cambia en deploy.sh,
          # cambiarla aquí también.
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          # La misma versión mayor que corre producción: imagen `node:22-bookworm` en
          # /opt/propyte/crm/docker-compose.yml y deploy.sh del VPS (#912). Antes era 20, que
          # llegó a fin de vida en abril de 2026. Si se cambia la imagen en el VPS, cambiarla
          # aquí también.
          node-version: "22"
          cache: pnpm

      # `--frozen-lockfile`: instala EXACTAMENTE pnpm-lock.yaml y falla si no casa con
      # package.json. Producción (deploy.sh del VPS) también instala congelado: un lock que no
      # casa detiene el despliegue allá y se queda la versión anterior. Mejor que falle aquí.
      # `postinstall` del proyecto corre `prisma generate`, así que el cliente queda
      # generado aquí. Importa: sin él, 34 archivos de prueba no cargan. pnpm 10 ignora los
      # build scripts de las dependencias (no el postinstall del proyecto), igual que en el
      # servidor; con el `node-linker=hoisted` de .npmrc el cliente queda en node_modules/.prisma.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los tres pasos siguientes llevan `if: '!cancelled()'` para que corran TODOS aunque
      # uno falle. Es el mismo criterio que se aplicó al cron de workflows: enterarse de
      # los tres problemas en una corrida es mejor que descubrirlos de uno en uno. El
      # trabajo igual queda en rojo si cualquiera falla.
      # `pnpm run typecheck` y no `npx tsc --noEmit`: el script lleva el límite de memoria
      # dentro (auditoría 2026-09-10). Antes el heap sólo se subía por el NODE_OPTIONS de
      # arriba, que existe en CI y no en la máquina de nadie — así que el comando de la
      # documentación se quedaba sin memoria en local y pasaba en CI. Ahora es el mismo
      # comando en los dos sitios.
      - name: Chequeo de tipos
        if: '!cancelled()'
        run: pnpm run typecheck

      - name: Pruebas
        if: '!cancelled()'
        run: pnpm test

      - name: Linter
        if: '!cancelled()'
        run: pnpm run lint
